server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The console loads no external origins: fonts, icons, three.js and echarts
    # are all bundled. `connect-src` therefore names only the API origin, which
    # is what makes the strict policy possible.
    #
    # These headers are in a snippet, and EVERY location below re-includes it.
    # nginx drops inherited `add_header` in any location that declares one of
    # its own, so a location with only Cache-Control would otherwise ship the
    # whole application with no CSP at all. See security-headers.conf.
    include /etc/nginx/snippets/security-headers.conf;

    # Liveness probe used by the container HEALTHCHECK.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed build assets are immutable.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # The console is a single-page app: unknown paths are client routes and must
    # fall back to the shell, otherwise a refresh on /twin returns a 404.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
}
