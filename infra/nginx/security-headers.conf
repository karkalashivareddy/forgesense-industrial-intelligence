# Security headers, in their own file so they can be included wherever needed.
#
# WHY A SNIPPET INSTEAD OF A `server`-LEVEL BLOCK
# ------------------------------------------------
# nginx does NOT inherit `add_header` into a `location` block that declares any
# `add_header` of its own. Every location in this config needs Cache-Control (or
# Content-Type), so declaring these headers only at `server` level silently
# discards them for every response the SPA actually serves.
#
# That is not theoretical: the policy below was present in this file at `server`
# level for the whole of the previous release, and the running container served
# the application document with NO security headers at all — no CSP, no
# X-Frame-Options, no nosniff. The config read as if it were protected while the
# protection was inert.
#
# The rule this file exists to enforce: if a location adds a header, it must
# also `include` this file. Re-test with:
#   curl -sI http://localhost:5173/ | grep -i content-security-policy

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 ws://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
