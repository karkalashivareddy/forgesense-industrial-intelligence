name: ForgeSense CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot 4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Compile + package
        run: ./mvnw -q -DskipTests package
      - name: Boot test (dev profile, security off)
        run: |
          SPRING_PROFILES_ACTIVE=dev FORGESENSE_SECURITY_ENABLED=false \
            java -jar target/forgesense-backend-1.0.0.jar &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/v1/factories > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/v1/factories > /dev/null

  ml-service:
    name: ML service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt
      - name: Train models (lazy on first boot)
        run: python -c "from app.models import _build_or_load; b=_build_or_load(); assert b.feature_names is not None"
      - name: Run API tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check app.js
        run: node --check app.js