name: ForgeSense CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked local credential defaults
        run: |
          if git grep -nE 'forgesense_dev_pw|forgesense-demo-jwt-signing-key|forgeSence-DemoPW|default forgesense-dev' -- ':!.github/workflows/ci.yml'; then
            echo "Tracked local credential material found"
            exit 1
          fi
          test ! -f .env

  backend:
    name: Backend (Spring Boot 4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Compile + package
        run: ./mvnw -q -DskipTests package
      - name: Boot test (dev profile, security off)
        run: |
          SPRING_PROFILES_ACTIVE=dev FORGESENSE_SECURITY_ENABLED=false \
            java -jar target/forgesense-backend-1.0.0.jar &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/v1/factories > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/v1/factories > /dev/null

  ml-service:
    name: ML service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt
      - name: Train models (lazy on first boot)
        run: python -c "from app.models import _build_or_load; b=_build_or_load(); assert b.feature_names is not None"
      - name: Run API tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check all frontend modules
        run: |
          for f in $(find js -name '*.js'); do
            node --check "$f" || exit 1
          done
      - name: Run node:test suite (pure logic)
        run: node --test test/util.test.mjs
