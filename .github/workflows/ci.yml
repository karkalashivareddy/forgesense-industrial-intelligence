name: ForgeSense CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked local credential defaults
        run: |
          dev_pw=$(printf '%s%s%s' 'forgesense' '_dev' '_pw')
          demo_key=$(printf '%s%s' 'forgesense' '-demo-jwt-signing-key')
          demo_pw=$(printf '%s%s' 'forgeSence' '-DemoPW')
          default_pw=$(printf '%s%s' 'default forgesense' '-dev')
          pattern="${dev_pw}|${demo_key}|${demo_pw}|${default_pw}"
          # git grep returns 1 when there are no matches. In GitHub Actions'
          # bash -e mode, preserve that expected result for the explicit check.
          matching=$(git grep -lE "$pattern" -- ':!.github/workflows/ci.yml' || true)
          if [ -n "$matching" ]; then
            echo "Tracked local credential material found:"
            printf '%s\n' "$matching"
            exit 1
          fi
          test ! -f .env

  backend:
    name: Backend (Spring Boot 4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Compile + tests + package
        run: ./mvnw -q package
      - name: Boot test (dev profile, security off)
        run: |
          SPRING_PROFILES_ACTIVE=dev FORGESENSE_SECURITY_ENABLED=false \
            java -jar target/forgesense-backend-1.0.0.jar &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/v1/factories > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/v1/factories > /dev/null

  ml-service:
    name: ML service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt
      - name: Train models (lazy on first boot)
        run: python -c "from app.models import _build_or_load; b=_build_or_load(); assert b.feature_names is not None"
      - name: Run API tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check all frontend modules
        run: |
          for f in $(find js -name '*.js'); do
            node --check "$f" || exit 1
          done
      - name: Run node:test suite (pure logic)
        run: node --test test/util.test.mjs
