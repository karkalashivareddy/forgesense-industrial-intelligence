name: ForgeSense CI

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: deliberately no workflow-level `env:` block.
#
# `FORGESENSE_SECURITY_ENABLED=false` must be scoped to the individual step
# that needs it (the boot smoke test), never to the whole workflow. Hoisting
# it disables authentication during `./mvnw package`, so the security tests
# assert against an open server and fail — and it would also disable auth for
# the Playwright run, whose fixtures sign in. The E2E job needs no workflow
# env: `.ci/boot-stack.sh` sets its own credentials and boots the full Compose
# profile.

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked local credential defaults
        run: |
          dev_pw=$(printf '%s%s%s' 'forgesense' '_dev' '_pw')
          demo_key=$(printf '%s%s' 'forgesense' '-demo-jwt-signing-key')
          demo_pw=$(printf '%s%s' 'forgeSence' '-DemoPW')
          default_pw=$(printf '%s%s' 'default forgesense' '-dev')
          pattern="${dev_pw}|${demo_key}|${demo_pw}|${default_pw}"
          matching=$(git grep -lE "$pattern" -- ':!.github/workflows/ci.yml' || true)
          if [ -n "$matching" ]; then
            echo "Tracked local credential material found:"
            printf '%s\n' "$matching"
            exit 1
          fi
          test ! -f .env
      - name: Reject innerHTML and debug logging in frontend source
        run: |
          # The console renders exclusively through React. An innerHTML
          # assignment is an XSS-shaped regression, and a stray console.error
          # would break the "zero console errors" acceptance criterion.
          bad=$(git grep -nE '\.innerHTML[[:space:]]*=|document\.write\(' -- 'frontend/src/**' || true)
          if [ -n "$bad" ]; then
            echo "innerHTML / document.write found in frontend source:"
            printf '%s\n' "$bad"
            exit 1
          fi
          bad=$(git grep -nE 'console\.(log|error)\(' -- 'frontend/src/**' || true)
          if [ -n "$bad" ]; then
            echo "console.log / console.error found in frontend source:"
            printf '%s\n' "$bad"
            exit 1
          fi
      - name: Reject external runtime origins
        run: |
          # Fonts, icons and 3D must be bundled. An external origin at runtime
          # is a supply-chain and availability dependency.
          bad=$(git grep -nE 'https?://(cdn\.jsdelivr|unpkg|fonts\.googleapis|fonts\.gstatic|cdnjs)' \
            -- 'frontend/src/**' 'frontend/index.html' || true)
          if [ -n "$bad" ]; then
            echo "External runtime origin referenced by the frontend:"
            printf '%s\n' "$bad"
            exit 1
          fi
      - name: Require a committed lockfile
        run: |
          test -f frontend/package-lock.json || {
            echo "frontend/package-lock.json is required for a reproducible build."; exit 1; }

  frontend:
    name: Frontend (typecheck, build, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile-pinned)
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [hygiene, backend, ml-service]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: Boot backend and ML service for the browser run
        run: |
          set -euo pipefail
          # Invoke through bash explicitly: the executable bit on a shell script
          # is not reliably preserved when the repo is cloned on Windows, and a
          # 100644 script makes this step fail with exit 126 (Permission denied).
          bash ../.ci/boot-stack.sh
      - name: Run E2E
        run: npm run e2e
      - name: Tear down the browser-run stack
        # Must happen after the browser run, and must always happen. boot-stack.sh
        # deliberately leaves the stack up on success.
        if: always()
        working-directory: .
        run: docker compose down -v --remove-orphans
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Relative to this job's working-directory (frontend), so the
          # prefix must not be repeated or the report is never uploaded.
          path: playwright-report
          retention-days: 7

  backend:
    name: Backend (Spring Boot 4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile, test, package
        run: ./mvnw -q package
      - name: Boot smoke test
        # Security is off *here only*: the smoke test curls an authenticated
        # endpoint without a token. Every other step keeps security enabled so
        # the security tests are meaningful.
        env:
          SPRING_PROFILES_ACTIVE: dev
          FORGESENSE_SECURITY_ENABLED: 'false'
        run: |
          set -euo pipefail
          java -jar target/forgesense-backend-1.0.0.jar &
          # Wait for the READINESS signal, not merely for the port to answer.
          # Tomcat serves /api/v1/factories as soon as the context is up, but
          # the application is not ready until ApplicationReadyEvent completes
          # (DemoPredictionSeeder runs there and takes a few seconds on a cold
          # H2 file). Until then readinessState is REFUSING_TRAFFIC and
          # /actuator/health answers 503 OUT_OF_SERVICE. Polling the API
          # returned 200 mid-seed, so the following health assertion raced the
          # seeder and failed with a bare curl exit code 22.
          ready=0
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::backend did not become ready within 90s"
            echo "health status: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health)"
            echo "health body:   $(curl -s http://localhost:8080/actuator/health)"
            exit 1
          fi
          # Report the real status and body: `curl -f` is silent on an HTTP
          # error, so a bare exit code cannot be diagnosed from the log.
          echo "factories status: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/factories)"
          echo "health status:    $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health)"
          echo "health body:      $(curl -s http://localhost:8080/actuator/health)"
          curl -sf http://localhost:8080/api/v1/factories > /dev/null
          curl -sf http://localhost:8080/actuator/health

  ml-service:
    name: ML service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -r requirements.txt
      - name: Train models (lazy on first boot)
        run: python -c "from app.models import _build_or_load; b=_build_or_load(); assert b.feature_names is not None"
      - name: Run API tests
        run: python -m pytest tests -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [hygiene, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the frontend image (npm ci + vite build + nginx)
        # Compose interpolates the whole file before it builds anything, so
        # these must be present even though the frontend image does not use
        # them. Never commit a real secret: these are build-time placeholders
        # and the hygiene job rejects any tracked credential default.
        env:
          POSTGRES_PASSWORD: ci
          FORGESENSE_SECURITY_JWT_SECRET: ci-secret-for-build-validation
        run: docker compose build frontend
      - name: Verify the compose topology still resolves
        env:
          POSTGRES_PASSWORD: ci
          FORGESENSE_SECURITY_JWT_SECRET: ci-secret-for-build-validation
        run: docker compose config --quiet
