spring:
  datasource:
    url: jdbc:h2:file:./data/forgesense-dev;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  h2:
    console:
      enabled: true
      path: /h2-console

forgesense:
  streaming:
    kafka:
      enabled: false
  cache:
    adapter: memory

management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html